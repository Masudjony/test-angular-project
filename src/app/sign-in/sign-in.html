
<main class="container">
  <section class="content">
    <h1>{{ title }}</h1>

    <p>Authenticate with your credentials to unlock the renter and house API calls.</p>

    <form (ngSubmit)="login()" #loginForm="ngForm" novalidate>
      <fieldset>
        <legend>Credentials</legend>
        <label>
          Username
          <input
            type="text"
            name="email"
            [(ngModel)]="credentials.email"
            required
            autocomplete="email"
          />
        </label>
        <label>
          Password
          <input
            type="password"
            name="password"
            [(ngModel)]="credentials.password"
            required
            autocomplete="current-password"
          />
        </label>
      </fieldset>

      <button type="submit" [disabled]="isLoading || loginForm.invalid" routerLink="dashboard">
        {{ isLoading ? 'Processing…' : 'Login' }}
      </button>
    </form>

    <p *ngIf="error" class="error">{{ error }}</p>
    <p *ngIf="status" class="status">{{ status }}</p>
  </section>
</main>
