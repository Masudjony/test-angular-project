<main class="container">
  <section class="content">
    <h1>{{ title }}</h1>

    <p>Authenticate with your credentials to unlock the renter and house API calls.</p>

    <form (ngSubmit)="login()" #loginForm="ngForm" novalidate>
      <fieldset>
        <legend>Credentials</legend>
        <label>
          Username
          <input
            type="text"
            name="email"
            [(ngModel)]="credentials.email"
            required
            autocomplete="email"
          />
        </label>
        <label>
          Password
          <input
            type="password"
            name="password"
            [(ngModel)]="credentials.password"
            required
            autocomplete="current-password"
          />
        </label>
      </fieldset>

      <button type="submit" [disabled]="isLoading || loginForm.invalid">
        {{ isLoading ? 'Processing…' : 'Login' }}
      </button>
    </form>

    <section class="api-list" *ngIf="isAuthenticated">
      <h2>Available API calls</h2>
      <ul>
        <li *ngFor="let api of apiCalls">
          <article class="api-card">
            <div class="api-details">
              <h3>{{ api.label }}</h3>
              <p>{{ api.description }}</p>
            </div>
            <button type="button" (click)="callApi(api.id)" [disabled]="isLoading">
              {{ isLoading ? 'Please wait…' : api.label }}
            </button>
          </article>
        </li>
      </ul>
    </section>

    <div class="message info" *ngIf="status && !error && !response">
      {{ status }}
    </div>

    <div class="message success" *ngIf="response && !error">
      <h2>API response</h2>
      <pre>{{ response }}</pre>
    </div>

    <div class="message error" *ngIf="error">
      {{ error }}
    </div>
  </section>
</main>
