<main class="container">
  <section class="content">
    <h1>{{ title }}</h1>
    <p>Press the button below to trigger a sample API call.</p>
    <button type="button" (click)="callApi()" [disabled]="isLoading">
      {{ isLoading ? 'Calling API…' : 'Call API' }}
    </button>

    <div class="message success" *ngIf="response && !error">
      <h2>API response</h2>
      <pre>{{ response }}</pre>
    </div>

    <div class="message error" *ngIf="error">
      {{ error }}
    </div>
  </section>
</main>
